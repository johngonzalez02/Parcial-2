<div class="container py-2">
  <div class="d-flex align-items-center mb-4">
    <i class="bi bi-star-fill fs-2 text-warning me-2"></i>
    <div>
      <h2 class="fw-bold m-0">Lo que más me ha gustado aprender</h2>
      <p class="text-muted m-0 small">Reflexión sobre los temas más destacados durante el curso</p>
    </div>
  </div>

  <div class="row g-4">
    @for (item of aprendizajes; track item.id) {
      <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-3 h-100">
          <div class="card-header bg-dark text-white d-flex align-items-center justify-content-between py-3">
            <span class="fw-bold">
              <i class="bi {{ item.icono }} text-primary me-2"></i>{{ item.tema }}
            </span>
            <span class="badge bg-primary rounded-pill">{{ item.corte }}</span>
          </div>
          <div class="card-body d-flex flex-column justify-content-between">
            <p class="card-text text-secondary mb-3 lh-base">
              {{ item.loQueMasMeGusto }}
            </p>
            <div>
              <span class="badge bg-success-subtle text-success border border-success-subtle fw-medium px-3 py-2 rounded-pill">
                <i class="bi bi-check2-circle me-1"></i>{{ item.destacado }}
              </span>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</div>
